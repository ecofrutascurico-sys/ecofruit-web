<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="EcoFruit | Fruta chilena para la industria" />
    <meta property="og:description" content="Fruta para jugo, congelado, sulfitado y food service. Romeral, Región del Maule, Chile." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#005029" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Eco Fruit SpA",
      "description": "Mayorista de frutas: abastecimiento para agroindustria, casinos, mayoristas e instituciones del Estado.",
      "url": "https://ecofruit.cl",
      "telephone": "+56994129056",
      "email": "jtoha@ecofruit.cl",
      "address": { "@type": "PostalAddress", "addressLocality": "Romeral", "addressRegion": "Región del Maule", "addressCountry": "CL" },
      "geo": { "@type": "GeoCoordinates", "latitude": -34.9619197, "longitude": -71.1654018 }
    }

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Formulario oculto para que Netlify Forms detecte los campos del formulario de cotización -->
    <form name="cotizacion" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="nombre" />
      <input name="empresa" />
      <input name="correo" type="email" />
      <input name="telefono" />
      <input name="tipo" />
      <textarea name="mensaje"></textarea>
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
