<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoFruit | Fruta chilena para la industria</title>
    <meta name="description" content="EcoFruit abastece de fruta chilena a mayoristas, agroindustrias, casinos e instituciones del Estado. Cereza, cítricos, uva, berries, kiwi, manzana y pera para jugo, congelado, sulfitado y food service. Región del Maule, Chile." />
    <meta property="og:title" content="EcoFruit | Fruta chilena para la industria" />
    <meta property="og:description" content="Fruta para jugo, congelado, sulfitado y food service. Región del Maule, Chile." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#005029" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Formulario oculto para que Netlify Forms detecte los campos del formulario de cotización -->
    <form name="cotizacion" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="nombre" />
      <input name="empresa" />
      <input name="correo" type="email" />
      <input name="telefono" />
      <input name="tipo" />
      <textarea name="mensaje"></textarea>
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
